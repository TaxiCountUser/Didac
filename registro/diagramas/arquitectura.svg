<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>TaxiCount — arquitectura y doble ruta de datos</title>
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#5B5348"/>
    </marker>
    <marker id="ar-a" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#C08A00"/>
    </marker>
  </defs>

  <rect width="960" height="600" fill="#FFFFFF"/>
  <text x="34" y="42" font-size="21" font-weight="600" fill="#1E1B16">TaxiCount — arquitectura de despliegue</text>
  <text x="34" y="64" font-size="13" fill="#7A7266">Tres piezas independientes y dos rutas de datos según el nivel de privilegio</text>

  <!-- Cliente -->
  <rect x="34" y="110" width="212" height="96" rx="10" fill="#FFF9EC" stroke="#E0B84C" stroke-width="1.5"/>
  <text x="140" y="140" font-size="14" font-weight="600" fill="#1E1B16" text-anchor="middle">App de conductor y jefe</text>
  <text x="140" y="161" font-size="12" fill="#6B6357" text-anchor="middle">Flutter · Android (APK/Play)</text>
  <text x="140" y="179" font-size="12" fill="#6B6357" text-anchor="middle">y web</text>
  <text x="140" y="197" font-size="11" fill="#9A9184" text-anchor="middle">~45 pantallas · es/en/ca</text>

  <!-- Panel admin -->
  <rect x="34" y="250" width="212" height="86" rx="10" fill="#F4F1FA" stroke="#9B8CC4" stroke-width="1.5"/>
  <text x="140" y="280" font-size="14" font-weight="600" fill="#1E1B16" text-anchor="middle">Panel de administración</text>
  <text x="140" y="301" font-size="12" fill="#6B6357" text-anchor="middle">Flutter web · GitHub Pages</text>
  <text x="140" y="321" font-size="11" fill="#9A9184" text-anchor="middle">binario y dominio separados</text>

  <!-- Backend -->
  <rect x="360" y="188" width="216" height="110" rx="10" fill="#F7F6F4" stroke="#8C8375" stroke-width="1.5"/>
  <text x="468" y="218" font-size="14" font-weight="600" fill="#1E1B16" text-anchor="middle">Backend Fastify</text>
  <text x="468" y="239" font-size="12" fill="#6B6357" text-anchor="middle">Node · desplegado en Render</text>
  <text x="468" y="259" font-size="12" fill="#6B6357" text-anchor="middle">clave service_role</text>
  <text x="468" y="281" font-size="11" fill="#9A9184" text-anchor="middle">98 endpoints · 17 módulos</text>

  <!-- Supabase -->
  <rect x="690" y="96" width="236" height="120" rx="10" fill="#F0F7F3" stroke="#4E9B78" stroke-width="1.5"/>
  <text x="808" y="126" font-size="14" font-weight="600" fill="#1E1B16" text-anchor="middle">Supabase</text>
  <text x="808" y="147" font-size="12" fill="#6B6357" text-anchor="middle">PostgreSQL · PostgREST</text>
  <text x="808" y="166" font-size="12" fill="#6B6357" text-anchor="middle">RLS · Realtime · Auth</text>
  <text x="808" y="189" font-size="11" fill="#9A9184" text-anchor="middle">29 tablas · 53 políticas RLS</text>
  <text x="808" y="206" font-size="11" fill="#9A9184" text-anchor="middle">aislamiento por tenant_id</text>

  <!-- Servicios externos -->
  <rect x="640" y="330" width="286" height="212" rx="10" fill="#FCFBFA" stroke="#C9C3B8" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="783" y="357" font-size="12" font-weight="600" fill="#7A7266" text-anchor="middle">SERVICIOS EXTERNOS</text>
  <rect x="664" y="372" width="238" height="46" rx="8" fill="#FFFFFF" stroke="#C9C3B8"/>
  <text x="783" y="392" font-size="13" font-weight="600" fill="#1E1B16" text-anchor="middle">Stripe</text>
  <text x="783" y="409" font-size="11" fill="#8A8275" text-anchor="middle">suscripción por asiento · webhooks</text>
  <rect x="664" y="428" width="238" height="46" rx="8" fill="#FFFFFF" stroke="#C9C3B8"/>
  <text x="783" y="448" font-size="13" font-weight="600" fill="#1E1B16" text-anchor="middle">Groq / OpenAI</text>
  <text x="783" y="465" font-size="11" fill="#8A8275" text-anchor="middle">Whisper (voz) + LLM (interpretación)</text>
  <rect x="664" y="484" width="238" height="46" rx="8" fill="#FFFFFF" stroke="#C9C3B8"/>
  <text x="783" y="504" font-size="13" font-weight="600" fill="#1E1B16" text-anchor="middle">Firebase Cloud Messaging</text>
  <text x="783" y="521" font-size="11" fill="#8A8275" text-anchor="middle">notificaciones push</text>

  <!-- Ruta A: cliente -> Supabase -->
  <path d="M246 138 C 420 96, 540 84, 690 122" fill="none" stroke="#C08A00" stroke-width="2" marker-end="url(#ar-a)"/>
  <rect x="392" y="76" width="196" height="36" rx="6" fill="#FFF9EC" stroke="#E0B84C"/>
  <text x="490" y="92" font-size="11.5" font-weight="600" fill="#8A6400" text-anchor="middle">RUTA A · directo a la base</text>
  <text x="490" y="106" font-size="11" fill="#8A6400" text-anchor="middle">JWT del usuario · autoriza la RLS</text>

  <!-- Ruta B: cliente -> backend -->
  <path d="M246 178 L 355 214" fill="none" stroke="#5B5348" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="254" y="200" width="98" height="32" rx="6" fill="#FFFFFF" stroke="#C9C3B8"/>
  <text x="303" y="215" font-size="11.5" font-weight="600" fill="#4A443B" text-anchor="middle">RUTA B</text>
  <text x="303" y="228" font-size="10.5" fill="#6B6357" text-anchor="middle">Bearer JWT</text>

  <!-- admin -> backend -->
  <path d="M246 286 L 355 272" fill="none" stroke="#5B5348" stroke-width="2" marker-end="url(#ar)"/>

  <!-- backend -> supabase -->
  <path d="M540 188 C 580 150, 630 130, 690 140" fill="none" stroke="#5B5348" stroke-width="2" marker-end="url(#ar)"/>
  <text x="608" y="132" font-size="11" fill="#6B6357" text-anchor="middle">service_role</text>

  <!-- backend -> externos -->
  <path d="M508 298 C 520 360, 570 392, 660 394" fill="none" stroke="#5B5348" stroke-width="1.8" marker-end="url(#ar)"/>
  <path d="M498 298 C 500 380, 540 448, 660 450" fill="none" stroke="#5B5348" stroke-width="1.8" marker-end="url(#ar)"/>
  <path d="M488 298 C 480 400, 520 502, 660 506" fill="none" stroke="#5B5348" stroke-width="1.8" marker-end="url(#ar)"/>

  <!-- nota -->
  <rect x="34" y="392" width="330" height="150" rx="10" fill="#FBFAF8" stroke="#DDD8CE"/>
  <text x="52" y="418" font-size="12.5" font-weight="600" fill="#1E1B16">Por qué dos rutas</text>
  <text x="52" y="442" font-size="11.5" fill="#5F594F">La ruta A cubre el CRUD de negocio y el tiempo real:</text>
  <text x="52" y="459" font-size="11.5" fill="#5F594F">la autorización la impone la base de datos mediante</text>
  <text x="52" y="476" font-size="11.5" fill="#5F594F">RLS, sin que el servidor intervenga.</text>
  <text x="52" y="500" font-size="11.5" fill="#5F594F">La ruta B queda reservada a lo que exige secretos o</text>
  <text x="52" y="517" font-size="11.5" fill="#5F594F">privilegios que nunca pueden vivir en el cliente: alta</text>
  <text x="52" y="534" font-size="11.5" fill="#5F594F">de conductores, Whisper, Stripe, informes y admin.</text>
</svg>
