name: Deploy Web (cliente, repo separado)

# Construye la app WEB de CLIENTE (entry point lib/main.dart) y la publica en un
# repo/Pages SEPARADO y PÚBLICO (solo output compilado), para que el repo de
# CÓDIGO (Didac) siga PRIVADO. Mismo patrón que deploy-admin-web.yml.
#
# ── Config ──────────────────────────────────────────────────────────────────────
# Repo destino: TaxiCountUser/taxicount-client (Pages, rama gh-pages).
# Dominio propio: www.taxicount.com (base-href "/"; se escribe el CNAME en cada deploy).
# Secret ADMIN_DEPLOY_TOKEN (ya puesto en Didac) con permiso de escritura al repo.
# Reutiliza los MISMOS secrets PROD_* que el APK.
# ──────────────────────────────────────────────────────────────────────────────—

on:
  push:
    branches: [main]
    paths: ['frontend/**']
  workflow_dispatch:

permissions:
  contents: read

env:
  CLIENT_REPO: TaxiCountUser/taxicount-client
  CLIENT_DOMAIN: www.taxicount.com

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get

      - name: Preparar --dart-define
        id: defines
        env:
          SUPABASE_URL: ${{ secrets.PROD_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.PROD_SUPABASE_ANON_KEY }}
          BACKEND_URL: ${{ secrets.PROD_BACKEND_URL }}
          STRIPE_PRICE_SEAT_MONTHLY: ${{ secrets.PROD_STRIPE_PRICE_SEAT_MONTHLY }}
          STRIPE_PRICE_SEAT_YEARLY: ${{ secrets.PROD_STRIPE_PRICE_SEAT_YEARLY }}
        run: |
          D=""
          add(){ [ -n "$2" ] && D="$D --dart-define=$1=$2"; return 0; }
          add SUPABASE_URL "$SUPABASE_URL"
          add SUPABASE_ANON_KEY "$SUPABASE_ANON_KEY"
          add BACKEND_URL "$BACKEND_URL"
          add STRIPE_PRICE_SEAT_MONTHLY "$STRIPE_PRICE_SEAT_MONTHLY"
          add STRIPE_PRICE_SEAT_YEARLY "$STRIPE_PRICE_SEAT_YEARLY"
          echo "args=$D" >> "$GITHUB_OUTPUT"
          if [ -z "$D" ]; then
            echo "::warning::Sin secrets PROD_*: la web apuntará a localhost (no servirá para testers)."
          fi

      # Versión visible en "Novedades" (el pubspec queda en 0.1.0). Contador = nº
      # de ejecución de ESTE workflow; se sufija "-web" para distinguirlo del APK.
      - name: Versionado
        id: version
        run: |
          echo "name=0.1.${{ github.run_number }}-web" >> "$GITHUB_OUTPUT"
          echo "code=${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      # Dominio propio (taxicount.com) => base-href "/". Si algún día se sirviera
      # bajo /taxicount-client/, habría que cambiarlo por "/taxicount-client/".
      - name: Build web (cliente)
        run: >
          flutter build web --release
          --base-href /
          --build-name=${{ steps.version.outputs.name }}
          --build-number=${{ steps.version.outputs.code }}
          ${{ steps.defines.outputs.args }}

      # Publica en el repo SEPARADO y PÚBLICO (rama gh-pages) con el token dedicado.
      # `cname` escribe el fichero CNAME en cada deploy para no perder el dominio.
      - name: Deploy a repo separado
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.ADMIN_DEPLOY_TOKEN }}
          external_repository: ${{ env.CLIENT_REPO }}
          publish_branch: gh-pages
          publish_dir: frontend/build/web
          cname: ${{ env.CLIENT_DOMAIN }}
